"""
Auth payload renvoyé lors de l'authentification / inscription.
En développement on expose accessToken + refresh_token dans la réponse.
En production, préférez stocker le refresh token en cookie HttpOnly (voir commentaires
dans les resolvers) pour réduire la surface d'attaque.
"""
