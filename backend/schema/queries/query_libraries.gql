        type PaginatedLibraries {
        libraries: [Library!]!
        totalCount: Int!
        hasNextPage: Boolean!
        }

extend type Query {        # Type pour les résultats de recherche paginés
        # Récupérer tous les livres de la bibliothèque
        getLibraries(
            limit: Int, 
            offset: Int, 
            order: String = "created_at", # Colonne par défaut pour le tri
            direction: String = "ASC" # Direction par défaut pour le tri (ASC ou DESC)
        ): PaginatedLibraries

        # Récupérer un livre de la bibliothèque par son ID
        getUserLibraries(id_user: ID!): [Library!]! 

        # Récupérer un livre de la bibliothèque par son ID (sans restriction d'utilisateur)
        getLibrary(id_library: ID!): Library

        # Rechercher des livres de la bibliothèque par titre ou auteur avec pagination
        searchLibraries(name: String!, limit: Int, offset: Int): PaginatedLibraries
}