  # Compter les signalements en cours de l'utilisateur
  getMyPendingReportsCount: Int!
}

# OU créer un nouveau fichier query_stats.gql :
type Query {
  # Statistiques du dashboard utilisateur
  getMyUnreadMessagesCount: Int!
  getMyPendingReportsCount: Int!
}
