type Mutation {

    #TABLE Reports
    # Ajouter un nouveau rapport
    addReport(
        id_user: String!
        report_type: String!
        reported_id: String!
        reason: String!
        status: String!
        details: String!
    ): Report!
    
    # Mettre à jour un rapport existant
    updateReport(
        id_report: ID!
        id_user: String
        report_type: String
        reported_id: String
        reason: String
        status: String
        details: String
    ): Report!
    
    # Supprimer un rapport par son ID
    deleteReport(id_report: ID!): Boolean!
}