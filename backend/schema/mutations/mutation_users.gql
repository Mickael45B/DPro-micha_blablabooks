extend type Mutation {        
        # Ajouter un nouvel utilisateur (renvoie AuthPayload pour fournir tokens + bibliothèques) => page d'inscription
        # register(input: CreateUserInput!): AuthPayload!
        createUser(input: CreateUserInput!): AuthPayload!

        # Mettre à jour un utilisateur existant
        updateUser(input: UpdateUserInput!): User!

        # Supprimer un utilisateur par son ID
        deleteUser(input: DeleteUserInput!): Boolean!

        # Activer ou désactiver un utilisateur (bloquer/débloquer) => met à jour le statut de l'utilisateur
        toggleUserStatus(input: ToggleUserStatusInput!): User!
        
}



