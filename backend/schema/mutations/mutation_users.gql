extend type Mutation {        
        # Ajouter un nouvel utilisateur (renvoie AuthPayload pour fournir tokens + bibliothèques)
        createUser(input: CreateUserInput!): AuthPayload!

        # Mettre à jour un utilisateur existant
        updateUser(input: UpdateUserInput!): User!

        # Réinitialisation forcée du mot de passe par un administrateur
        adminResetPassword(input: AdminResetPasswordInput!): Boolean!

        # Changer le mot de passe d'un utilisateur
        changePassword(input: ChangePasswordInput!): Boolean!

        # Supprimer un utilisateur par son ID
        deleteUser(input: DeleteUserInput!): Boolean!

        # Inscription (alias possible)
        register(input: RegisterUserInput!): AuthPayload!
        
        # Connexion
        login(input: LoginInput!): AuthPayload!
        
        # Renouveler le token
        refreshToken(refresh_token: String!): TokenPayload!

        lastLogin(last_login: String!): TokenPayload!
        
        # Déconnexion
        logout: Boolean!
        }



