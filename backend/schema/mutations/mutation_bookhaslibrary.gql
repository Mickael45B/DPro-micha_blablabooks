type ManyBooksFromLibrary {
  booksInLibrary: [BookHasLibrary!]!
  httpStatus: Int
}
extend type Mutation {
    #TABLE bookhaslibrary
    # Ajouter une nouvelle relation
    addBookHasLibrary(input: CreateBookHasLibraryInput!): BookHasLibrary!

    # Mettre à jour une relation existante
    updateLibraryInBookHasLibrary(input: UpdateLibraryInBookHasLibraryInput!): BookHasLibrary!

    # Mettre à jour le statut "lu" d'un livre dans une bibliothèque
    updateReadStatusInBookHasLibrary(input: UpdateReadStatusInBookHasLibraryInput!): BookHasLibrary!

    # Mettre à jour le statut "favori" d'un livre dans une bibliothèque
    updateFavoriteStatusInBookHasLibrary(input: UpdateFavoriteStatusInBookHasLibraryInput!): BookHasLibrary!

    # Mettre à jour la progression de lecture
    updateProgressPercentage(id_bookhaslibrary: ID!, progress_percentage: Int!): BookHasLibrary!

    # Supprimer une relation par son ID
    deleteBookHasLibrary(input: DeleteBookHasLibraryInput!): Boolean!

    # Ajouter ou retirer des livres d'une bibliothèque
    addBooksToLibrary(input: AddBooksToLibraryInput!): ManyBooksFromLibrary!

    # Retirer des livres d'une bibliothèque
    removeBooksFromLibrary(input: RemoveBooksFromLibraryInput!): ManyBooksFromLibrary!

    #Déplacer un livre d'une bibliothèque à une autre
    moveBookToLibrary(input: MoveBookInput!): Boolean!

    #Déplacer plusieurs livres en une fois
    bulkMoveBooks(input: BulkMoveInput!): Int!

    #Réorganiser les livres dans une bibliothèque
    reorderBooksInLibrary(id_library: ID!, book_ids: [ID!]!): Boolean!



}