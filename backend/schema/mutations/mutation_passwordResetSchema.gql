extend type Mutation {        
  # Demander une réinitialisation de mot de passe
  requestPasswordReset(input: RequestPasswordResetInput!): Boolean!

  # Réinitialiser le mot de passe
  resetPassword(input: ResetPasswordInput!): Boolean!

  # Vérifier la validité du code de réinitialisation
  verifyResetCode(input: VerifyResetCodeInput!): Boolean!
  
  # Réinitialisation forcée du mot de passe (admin)
  adminResetPassword(input: AdminResetPasswordInput!): Boolean!

  # Changer le mot de passe
  changePassword(input: ChangePasswordInput!): Boolean!

  # Supprimer un utilisateur
  deleteUser(input: DeleteUserInput!): Boolean!

  # Inscription
  register(input: CreateUserInput!): AuthPayload!

  # Débloquer un compte (admin)
  unblockAccount(input: UnblockAccountInput!): Boolean!

  # Demander le déblocage de son compte
  requestAdminUnblock(input: RequestAdminUnblockInput!): Boolean!
}