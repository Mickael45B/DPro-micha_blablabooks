# Créer une association livre-bibliothèque
input CreateBookHasLibraryInput {
  id_book: ID!
  id_library: ID!
  id_bookhaslibrary: ID
  is_read: Boolean
  is_favorite: Boolean
  progress_percentage: Int
  personal_note: String
  started_at: DateTime
  finished_at: DateTime
  lent_to: String
  lent_at: DateTime
  created_at: DateTime
  updated_at: DateTime
  tags: [String!]
}

input UpdateFavoriteStatusInBookHasLibraryInput {
  id_book: String
}

# Input pour déplacer un livre entre bibliothèques

input MoveBookInput {
  id_book: String!
  from_library_id: String!
  to_library_id: String!
}

# Input pour actions groupées
input BulkMoveInput {
  book_ids: [String!]!
  from_library_id: String!
  to_library_id: String!
}


# Input pour recherche/filtrage dans bibliothèques
input LibraryFilterInput {
  search: String
  is_default: Boolean
  is_public: Boolean
  sort_field: LibrarySortField
  sort_direction: SortDirection
}

# Input pour recherche/filtrage de livres dans bibliothèque
input BookInLibraryFilterInput {
  search: String
  reading_status: ReadingStatus
  is_favorite: Boolean
  tags: [String!]
  min_rating: Float
  max_rating: Float
  lent: Boolean
  sort_field: BookInLibrarySortField
  sort_direction: SortDirection
}









input UpdateBookInLibraryInput {
  id_book: ID!
  id_library: ID!
  id_bookhaslibrary: ID!
  is_read: Boolean
  is_favorite: Boolean!
  progress_percentage: Int
  personal_note: String
  started_at: DateTime
  finished_at: DateTime
  lent_to: String
  lent_at: DateTime
  created_at: DateTime
  updated_at: DateTime
  tags: [String!]
}

# Mettre à jour une association livre-bibliothèque
input UpdateLibraryInBookHasLibraryInput {
  id_bookhaslibrary: ID
}

# Mettre à jour le statut "lu" d'un livre dans une bibliothèque
input UpdateReadStatusInBookHasLibraryInput {
  id_bookhaslibrary: ID!
}

# Supprimer une association livre-bibliothèque
input DeleteBookHasLibraryInput {
  id_bookhaslibrary: String
  id_library: String
  id_book: String
}

# Ajouter des livres à une bibliothèque
input AddBooksToLibraryInput {
books: [CreateBookHasLibraryInput!]!
}

# Retirer des livres d'une bibliothèque
input RemoveBooksFromLibraryInput {
  libraryId: ID!
  bookIds: [ID!]!
}

# Marquer un livre comme lu/non lu
input MarkBookAsReadInput {
  idBookHasLibrary: ID!
  isRead: Boolean!
}

# Marquer un livre comme favori/non favori
input ToggleFavoriteInput {
  idBookHasLibrary: String
  isFavorite: Boolean
  id_book: String
}