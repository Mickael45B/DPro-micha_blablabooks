input CreateMessageInput {
  content: String!
  id_sender: String!
  id_receiver: String!
  subject: String!
}

input UpdateMessageInput {
  id_message: ID!
  content: String
  subject: String
}

input DeleteMessageInput {
  id_message: ID!
}

# Marquer un message comme lu
input MarkMessageAsReadInput {
  idMessage: ID!
}

# Envoyer un message
input SendMessageInput {
  receiverId: ID!
  subject: String!
  content: String!
}