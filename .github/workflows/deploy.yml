name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List repository root (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Listing root:"
          ls -la

      - name: Ensure Frontend directory exists
        run: |
          if [ ! -d "./Frontend" ]; then
            echo "::error file=deploy.yml::Le dossier ./Frontend est introuvable dans le repo root. Vérifie son emplacement (ex: backend/Frontend) et ajuste working-directory ou déplace le workflow sous .github/workflows à la racine."
            ls -la
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build project
        working-directory: ./Frontend
        run: npm run build --if-present

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Frontend/dist