name: Deploy Frontend to GitHub Pages

# déclencheur
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

  # runner
jobs:
  build:
    runs-on: ubuntu-latest
    # Démarrer un service Redis pour les tests

    env:
      DISABLE_REDIS: 'true'
      NODE_ENV: 'test'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    permissions:
      contents: write
      pages: write

      # Etapes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # expliciter l'utilisation du token injecté par GitHub Actions
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js (for tests)
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install root dependencies (for tests)
        run: npm ci
      
      - name: Install backend dependencies
        run: npm ci --prefix ./backend
    
      - name: List tests directory (debug)
        run: |
          echo "Listing backend/test:"
          ls -la backend/test || true
      
      - name: Run backend/unit tests
        # lance tous les tests node dans backend/test (ajuste si tu utilises npm test)
        run: node --test ./backend/test/unit
        env:
          # ✅ S'assurer que DISABLE_REDIS est bien défini
          DISABLE_REDIS: 'true'
          NODE_ENV: 'test'      
      
      - name: List repository root (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Listing root:"
          ls -la

      - name: Ensure Frontend directory exists
        run: |
          if [ ! -d "./Frontend" ]; then
            echo "::error file=deploy.yml::Le dossier ./Frontend est introuvable dans le repo root. Vérifie son emplacement (ex: backend/Frontend) et ajuste working-directory ou déplace le workflow sous .github/workflows à la racine."
            ls -la
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Build project
        working-directory: ./Frontend
        run: npm run build --if-present

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Frontend/dist