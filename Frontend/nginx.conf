server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Routes SPA : si le fichier demandé n'existe pas, renvoyer index.html
    location / {
        try_files $uri /index.html;
    }

    # Assets statiques
    location /assets/ {
        try_files $uri =404;
    }

    # Optionnel : favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
