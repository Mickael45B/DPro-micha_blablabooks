services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: blablabook
      POSTGRES_PASSWORD: blablabook
      POSTGRES_DB: blablabook
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql
      - ./backend/db/seeding.sql:/docker-entrypoint-initdb.d/seeding.sql    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blablabook"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - blablabooks-network

 # Redis pour le rate limiting
  redis:
    image: redis:7-alpine
    container_name: myapp_redis
    # REDIS_PASSWORD a une valeur par défaut vide si non fournie (évite l'avertissement)
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-""}
    command: >
      sh -c 'if [ -n """${REDIS_PASSWORD}""" ]; then \
        redis-server --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru; \
      else \
        redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru; \
      fi'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - blablabooks-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blablabooks-backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://blablabook:blablabook@db:5432/blablabook
      DB_NAME: blablabook
      DB_USERNAME: blablabook
      DB_PASSWORD: blablabook
      DB_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD} 
    volumes:
      - ./backend:/app
    working_dir: /app
    command: sh -c "until nc -z db 5432; do echo 'Waiting for DB...'; sleep 2; done; npm install && npm run start"
    restart: always
    networks:
      - blablabooks-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blablabooks-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://backend:3000
    restart: always
    networks:
      - blablabooks-network

volumes:
  postgres-data:
  redis_data:

networks:
  blablabooks-network:
    driver: bridge